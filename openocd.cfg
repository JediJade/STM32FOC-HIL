# STM32F103C8 over an ST-Link, DAP-direct (no HLA), so that the same
# OpenOCD bundle works whatever legacy script dirs are on the path.
#
# The same chip and the same settings as the drive: this board is the
# drive's twin, which is the whole point of it. That also means OpenOCD
# cannot tell the two apart - both answer to device id 0x20036410 - so
# when both are on the bench, be sure the programmer is on the one you
# mean before writing to it.
source [find interface/stlink.cfg]
transport select swd
adapter speed 950

swd newdap chip cpu -enable
dap create chip.dap -chain-position chip.cpu
target create chip.cpu cortex_m -dap chip.dap
chip.cpu configure -work-area-phys 0x20000000 -work-area-size 0x1000 -work-area-backup 0

flash bank chip.flash stm32f1x 0x08000000 0 0 0 chip.cpu
reset_config none
cortex_m reset_config sysresetreq
